name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore NotifyX.slnx

      - name: Build solution
        run: dotnet build NotifyX.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test NotifyX.slnx --no-build --configuration Release --verbosity normal
